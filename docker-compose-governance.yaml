services:
  marquez-db:
    image: postgres:14
    container_name: marquez-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
      - POSTGRES_DB=marquez
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U marquez" ]
      interval: 5s
      timeout: 5s
      retries: 5

  marquez:
    image: marquezproject/marquez:latest
    container_name: marquez
    ports:
      - "5006:5000" # API
      - "5001:5001" # Admin
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      - MARQUEZ_DB_HOST=marquez-db
      - MARQUEZ_DB_PORT=5432
      - MARQUEZ_DB_USER=marquez
      - MARQUEZ_DB_PASSWORD=marquez
      - MARQUEZ_DB_NAME=marquez
      - POSTGRES_HOST=marquez-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
      - POSTGRES_DB=marquez
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5001/ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kind
      - default

  marquez-ui:
    image: marquezproject/marquez-web:latest
    container_name: marquez-ui
    ports:
      - "5005:3000"
    environment:
      - MARQUEZ_HOST=marquez
      - MARQUEZ_PORT=5000
      - WEB_PORT=3000
    depends_on:
      - marquez
    networks:
      - kind
      - default

networks:
  kind:
    external: true
    name: kind
